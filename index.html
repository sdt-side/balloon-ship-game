<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>うさぎの空旅</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#203c3f;color:#fff;font-family:system-ui;overflow:hidden}body{display:grid;place-items:center}#wrap{position:relative;width:min(100vw,960px);height:min(100dvh,660px)}canvas{width:100%;height:100%;image-rendering:pixelated;display:block}#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;font-size:14px;text-shadow:0 2px #345}#pad{position:absolute;left:14px;bottom:14px;width:118px;height:118px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px}.empty{visibility:hidden}button{border:1px solid #ffffff40;border-radius:10px;background:#183f517d;color:white;font:inherit;touch-action:none;user-select:none;-webkit-user-select:none}button:active,button.held{background:#ffffff65}.btn{font-size:18px}#alt{position:absolute;right:14px;bottom:14px;display:grid;gap:8px;width:76px}#alt button{height:52px;font-size:15px}#sound{padding:7px 10px}#note{position:absolute;bottom:146px;left:12px;right:12px;text-align:center;font-size:14px;pointer-events:none;text-shadow:0 1px 3px #163944}canvas{touch-action:none}@media(min-width:700px){#wrap{height:min(100dvh,540px)}}
</style><div id="wrap"><canvas id="game" width="400" height="280"></canvas><div id="hud"><span>うさぎの空旅 <span id="height"></span></span><button id="sound">音 OFF</button></div><div id="note">方向パッドで移動・右下で上昇／下降</div><div id="pad" aria-label="移動"><div class="empty"></div><button class="btn" data-k="up" aria-label="前進">▲</button><div class="empty"></div><button class="btn" data-k="left" aria-label="左">◀</button><div class="empty"></div><button class="btn" data-k="right" aria-label="右">▶</button><div class="empty"></div><button class="btn" data-k="down" aria-label="後退">▼</button><div class="empty"></div></div><div id="alt"><button data-k="rise">上昇</button><button data-k="fall">下降</button></div></div>
<script>
'use strict';
const c=document.getElementById('game'),g=c.getContext('2d'),W=400,H=280,k={},ship={x:0,y:0,z:16},ports=[{x:0,y:0,name:'草原の港'},{x:430,y:260,name:'川辺の村'},{x:-480,y:620,name:'森の停泊場'},{x:670,y:-480,name:'丘の村'}];let t=0,last=0,view=16,sound=false,audio,landed=false,notice='',noticeTime=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
function poly(points,col){g.fillStyle=col;g.beginPath();points.forEach((p,i)=>i?g.lineTo(Math.round(p[0]),Math.round(p[1])):g.moveTo(Math.round(p[0]),Math.round(p[1])));g.closePath();g.fill()}
function hash(x,y){let n=Math.imul(x,374761393)^Math.imul(y,668265263);n=Math.imul(n^(n>>>13),1274126177);return(n^(n>>>16))>>>0}
function tone(freq=600){if(!sound||!audio)return;const o=audio.createOscillator(),v=audio.createGain();o.type='square';o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.7,audio.currentTime+.14);v.gain.setValueAtTime(.025,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.16);o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+.17)}
document.getElementById('sound').onclick=async()=>{audio??=new(window.AudioContext||window.webkitAudioContext)();await audio.resume();sound=!sound;document.getElementById('sound').textContent='音 '+(sound?'ON':'OFF');tone()};
const map={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',KeyE:'rise',Space:'rise',KeyQ:'fall',ShiftLeft:'fall',ShiftRight:'fall'};
addEventListener('keydown',e=>{if(map[e.code]){k[map[e.code]]=true;e.preventDefault()}});addEventListener('keyup',e=>{if(map[e.code]){k[map[e.code]]=false;e.preventDefault()}});function release(){Object.keys(k).forEach(x=>k[x]=false);document.querySelectorAll('.held').forEach(b=>b.classList.remove('held'));last=0}addEventListener('blur',release);document.addEventListener('visibilitychange',release);
document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);k[b.dataset.k]=true;b.classList.add('held');e.preventDefault()};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>{k[b.dataset.k]=false;b.classList.remove('held')}});
let f=0,horizon=0,camDepth=0;
function project(x,y){const dx=x-ship.x,dy=y-ship.y,depth=dy+camDepth;const sc=260/(260+depth);return{x:200+dx*sc,y:horizon+(260*camDepth*f)/(260+depth),s:sc,d:depth}}
function ground(){const q=view/150;f=.84-q*.69;horizon=24+q*70;camDepth=145+q*310;
rect(0,0,W,H,'#a9dbe1');rect(0,0,W,44,'#84c4d9');rect(0,44,W,45,'#98d1df');poly([[0,horizon+12],[38,horizon-6],[65,horizon+8],[99,horizon-13],[143,horizon+11],[183,horizon-2],[225,horizon+14],[276,horizon-15],[312,horizon+6],[355,horizon-4],[400,horizon+12],[400,H],[0,H]],'#8fb7a3');rect(0,horizon+19,W,H,'#86b966');
const range=1800,step=42,startX=Math.floor((ship.x-range)/step)*step,startY=Math.floor((ship.y-camDepth+28)/step)*step;let objects=[];
for(let y=startY;y<ship.y+range;y+=step){for(let x=startX;x<ship.x+range;x+=step){const p=project(x,y);if(p.d<25||p.x<-90||p.x>490||p.y< horizon||p.y>330)continue;const n=hash(x,y),s=p.s;const river=Math.abs(x-(180+Math.sin(y/260)*90))<45;
if(river){rect(p.x-23*s,p.y-2,46*s,Math.max(2,step*f*s*s),'#63b9c7');if(n%4===0)rect(p.x,p.y,12*s,1,'#b5e9df');if(Math.abs(y-280)<25)rect(p.x-24*s,p.y-3*s,48*s,7*s,'#b58a59');}
else{if(n%11===0)rect(p.x,p.y,5*s,Math.max(1,2*s),'#c8c190');if(n%5===0){rect(p.x,p.y,1,3*s,'#66974e');rect(p.x+3*s,p.y+2*s,2*s,1,'#6e9f50')}if(n%19===0)rect(p.x,p.y,2*s,2*s,'#f5e2a0');if(n%23===0)objects.push({p,type:'tree'});else if(n%31===0)objects.push({p,type:'rock'})}}
}
ports.forEach(port=>{const p=project(port.x,port.y);if(p.d>25&&p.x>-80&&p.x<480)objects.push({p,type:'port',port})});objects.sort((a,b)=>a.p.y-b.p.y);objects.forEach(({p,type,port})=>{const{x,y,s}=p;if(type==='tree'){rect(x-2*s,y-12*s,4*s,12*s,'#846647');rect(x-10*s,y-27*s,20*s,16*s,'#427c55');rect(x-7*s,y-33*s,14*s,9*s,'#508d58');rect(x-6*s,y-29*s,5*s,9*s,'#69a55d')}else if(type==='rock'){rect(x-5*s,y-4*s,10*s,4*s,'#7c8c78');rect(x-3*s,y-6*s,6*s,2*s,'#aab29a')}else{rect(x-34*s,y-9*s,68*s,20*s,'#d9c99a');rect(x-27*s,y-5*s,54*s,2*s,'#b29b72');rect(x-10*s,y-5*s,20*s,2*s,'#fff4c8');rect(x-2*s,y-12*s,4*s,16*s,'#fff4c8');rect(x+23*s,y-28*s,27*s,20*s,'#f0dfb5');poly([[x+18*s,y-28*s],[x+36*s,y-41*s],[x+55*s,y-28*s]],'#b66b55');rect(x+34*s,y-19*s,7*s,11*s,'#755d4f');rect(x+26*s,y-23*s,5*s,5*s,'#78afb5')}});
}
function cloud(x,y,s){rect(x,y,34*s,8*s,'#e3f3e8');rect(x+7*s,y-7*s,20*s,9*s,'#f4faf0');rect(x+14*s,y-11*s,10*s,7*s,'#f4faf0')}
function balloon(){const q=view/150,x=200+Math.sin(t*1.7)*1.5,y=156+q*24+Math.sin(t*2)*2;rect(x-9,y+18+view*.14,18,2,'#507b6550');
g.save();g.translate(Math.round(x),Math.round(y));g.scale(.5,.5);
// Stepped balloon silhouette and stitched stripes.
rect(-20,-67,40,4,'#66564d');rect(-28,-63,56,8,'#66564d');rect(-32,-55,64,28,'#66564d');rect(-28,-27,56,12,'#66564d');rect(-20,-15,40,8,'#66564d');rect(-12,-7,24,5,'#66564d');
rect(-18,-64,36,4,'#f6dba0');rect(-26,-60,52,10,'#ecb66f');rect(-29,-50,58,23,'#ebad68');rect(-25,-27,50,9,'#df965d');rect(-17,-18,34,8,'#d68e56');rect(-10,-10,20,5,'#bf7850');rect(-8,-63,16,49,'#f6dda2');rect(-23,-55,9,30,'#cc7359');rect(15,-55,9,30,'#cc7359');rect(-7,-58,4,14,'#fff0c1');rect(-13,-3,2,27,'#776454');rect(12,-3,2,27,'#776454');
const deck=9+Math.round((1-q)*6);poly([[-29,deck],[-23,deck+12],[18,deck+12],[30,deck],[-29,deck]],'#715147');rect(-26,deck,53,3,'#d6a477');rect(-20,deck+4,40,3,'#a97955');rect(-12,deck+8,22,2,'#b68a5d');rect(7,deck-12,13,12,'#dbc494');rect(5,deck-14,17,3,'#987055');rect(11,deck-9,5,4,'#75a9ad');rect(-35,deck+2,8,2,'#675449');rect(-36,deck-3+(Math.floor(t*16)%2)*3,2,10,'#b9b697');
// Rabbit stays aboard, ears and face visible over the gunwale.
rect(-15,deck-12,9,9,'#f4ead9');rect(-14,deck-20,3,9,'#f4ead9');rect(-8,deck-21,3,10,'#f4ead9');rect(-13,deck-18,1,5,'#e5a7a1');rect(-7,deck-19,1,5,'#e5a7a1');rect(-13,deck-9,1,2,'#584a45');rect(-8,deck-9,1,2,'#584a45');rect(-10,deck-6,1,1,'#db9c96');
if(k.rise&&!landed){rect(-2,-2,4,7,'#f8c96d');rect(-1,0,2,4,'#fff3aa')}
g.restore();
let speech=landed?'ここで、ひと休み。':noticeTime>0?notice:view>110?'雲が近いね。':view>65?'遠くまで見えるね。':'のんびり飛ぼう。';g.font='10px system-ui';const tw=g.measureText(speech).width;rect(x-tw/2-8,y-65,tw+16,20,'#fff6de');rect(x-3,y-45,6,5,'#fff6de');g.fillStyle='#594d45';g.fillText(speech,Math.round(x-tw/2),Math.round(y-52));}
function update(dt){t+=dt;noticeTime=Math.max(0,noticeTime-dt);const dx=(k.right?1:0)-(k.left?1:0),dy=(k.down?1:0)-(k.up?1:0),len=Math.hypot(dx,dy)||1;
ship.z=clamp(ship.z+((k.rise?1:0)-(k.fall?1:0))*36*dt,0,150);if(ship.z>2||!landed){ship.x=clamp(ship.x+dx/len*90*dt,-1100,1100);ship.y=clamp(ship.y+dy/len*90*dt,-900,1300)}
const port=ports.find(p=>Math.hypot(p.x-ship.x,p.y-ship.y)<40);const was=landed;landed=!!port&&ship.z<2;if(landed){ship.x+=(port.x-ship.x)*Math.min(1,dt*3);ship.y+=(port.y-ship.y)*Math.min(1,dt*3)}if(landed&&!was){notice=port.name+'に到着';noticeTime=4;tone(880)}if(ship.z===0&&!port){ship.z=2;notice='停泊場の上で降りよう。';noticeTime=3}view+=(ship.z-view)*Math.min(1,dt*3);document.getElementById('height').textContent='｜高度 '+Math.round(ship.z)+' m';
const target=ports.reduce((a,b)=>Math.hypot(a.x-ship.x,a.y-ship.y)<Math.hypot(b.x-ship.x,b.y-ship.y)?a:b);document.getElementById('note').textContent=landed?target.name+'で休憩中 · 上昇で出発':target.name+'まで '+Math.round(Math.hypot(target.x-ship.x,target.y-ship.y))+' m'+(Math.hypot(target.x-ship.x,target.y-ship.y)<40?' · 下降で停泊':'');}
function draw(){ground();for(let i=0;i<5;i++){let x=((i*107+t*(2+i)+ship.x*.04)%500+500)%500-60;cloud(x,30+i%3*16,.6+i%2*.4)}balloon();if(view>85){for(let i=0;i<2;i++)cloud(((i*257+t*15-ship.x*.15)%600+600)%600-100,210+i*35,1.6)}g.font='9px system-ui';g.fillStyle='#315755';g.fillText('PC: WASD / 矢印 · E 上昇 · Q 下降',12, H-4)}
function loop(now){const dt=last?Math.min((now-last)/1000,.04):0;last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
