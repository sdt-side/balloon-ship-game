function skyDiscoveries(){if(!skyEvent||view<110)return;const age=skyEvent.duration-skyEvent.life,alpha=Math.min(1,age/2,skyEvent.life/2,(view-110)/15);g.save();g.globalAlpha=alpha;let x=skyEvent.x+Math.sin(age*.2)*8,y=62+Math.sin(age*.5)*3;if(skyEvent.kind==='rainbow'){const colors=['#ee9c9c','#f2c080','#e6dc90','#9acb9a','#8ab8d4','#b9a4d2'];colors.forEach((col,i)=>{const radius=40-i*3;for(let a=0;a<=Math.PI;a+=.065)rect(x+Math.cos(a)*radius,y-Math.sin(a)*radius,3,3,col)});cloud(x-48,y,1);cloud(x+25,y,1)}else{x=200+(skyEvent.wx-ship.x)*.35;y=185+(skyEvent.wy-ship.y)*.2+(ship.z-skyEvent.z)*.6;poly([[x-25,y],[x+27,y],[x+16,y+14],[x-8,y+24]],'#a69177');rect(x-26,y-3,54,5,'#a7bb8c');rect(x-23,y-1,45,3,'#7e9474');if(!skyEvent.taken){parcel('castle',x,y-9,1.1);if(islandNear()){g.strokeStyle='#fff0a6';g.strokeRect(x-12,y-19,24,23)}rect(x+16,y-19,2,6,'#fff0a6');rect(x+14,y-17,6,2,'#fff0a6')}cloud(x-36,y+18,.9)}g.restore()}

document.getElementById('sound').onclick=()=>{muted=audio?.state==='running'?!muted:false;const button=document.getElementById('sound');button.textContent=muted?'×':'♪';button.setAttribute('aria-pressed',String(!muted));if(muted){stop(bgmOsc);stop(sfxOsc)}ensureAudio()};
addEventListener('pointerdown',ensureAudio,{capture:true});addEventListener('touchend',ensureAudio,{passive:true});addEventListener('keydown',ensureAudio);
const map={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',KeyE:'rise',Space:'rise',KeyQ:'fall',ShiftLeft:'fall',ShiftRight:'fall'};
addEventListener('keydown',e=>{if(map[e.code]){k[map[e.code]]=true;e.preventDefault()}});addEventListener('keyup',e=>{if(map[e.code]){k[map[e.code]]=false;e.preventDefault()}});function release(){Object.keys(k).forEach(x=>k[x]=false);document.querySelectorAll('.held').forEach(b=>b.classList.remove('held'));last=0}addEventListener('blur',release);document.addEventListener('visibilitychange',release);

function ground(){const q=view/150;f=.84-q*.69;horizon=24+q*70;camDepth=145+q*310;
rect(0,0,W,H,'#a9dbe1');rect(0,0,W,44,'#84c4d9');rect(0,44,W,45,'#98d1df');poly([[0,horizon+12],[38,horizon-6],[65,horizon+8],[99,horizon-13],[143,horizon+11],[183,horizon-2],[225,horizon+14],[276,horizon-15],[312,horizon+6],[355,horizon-4],[400,horizon+12],[400,H],[0,H]],'#8fb7a3');rect(0,horizon+19,W,H,'#86b966');
const range=1800,step=42,startX=Math.floor((ship.x-range)/step)*step,startY=Math.floor((ship.y-camDepth+28)/step)*step;let objects=[];
for(let y=startY;y<ship.y+range;y+=step){for(let x=startX;x<ship.x+range;x+=step){const p=project(x,y);if(p.d<25||p.x<-90||p.x>490||p.y< horizon||p.y>330)continue;const n=hash(x,y),s=p.s;const river=Math.abs(x-(180+Math.sin(y/260)*90))<45;

else{if(n%11===0)rect(p.x,p.y,5*s,Math.max(1,2*s),'#c8c190');if(n%5===0){rect(p.x,p.y,1,3*s,'#66974e');rect(p.x+3*s,p.y+2*s,2*s,1,'#6e9f50')}if(n%19===0)rect(p.x,p.y,2*s,2*s,'#f5e2a0');if(n%23===0)objects.push({p,type:'tree'});else if(n%31===0)objects.push({p,type:'rock'})}}

}
function cloud(x,y,s){rect(x,y,34*s,8*s,'#e3f3e8');rect(x+7*s,y-7*s,20*s,9*s,'#f4faf0');rect(x+14*s,y-11*s,10*s,7*s,'#f4faf0')}
function balloon(){const q=view/150,x=200+Math.sin(t*1.7)*1.5,y=156+q*24+Math.sin(t*2)*2;const landingPoint=project(ship.x,ship.y);rect(landingPoint.x-9,landingPoint.y-1,18,3,'#507b6550');
g.save();g.translate(Math.round(x),Math.round(y));g.scale(.5,.5);

rect(-7,-12,14,5,'#b8945d');rect(-5,-7,10,3,'#dfc18b');
rect(-18,-16,1,32,'#876e54');rect(17,-16,1,32,'#876e54');rect(-8,-5,1,20,'#b39970');rect(7,-5,1,20,'#b39970');
rect(-4,-41,3,3,'#bd7d8c');rect(1,-41,3,3,'#bd7d8c');rect(-3,-38,6,2,'#bd7d8c');rect(-2,-36,4,2,'#bd7d8c');rect(-1,-34,2,1,'#bd7d8c');
rect(-20,-26,5,3,'#fff0ca');rect(16,-26,5,3,'#fff0ca');rect(-18,-23,1,6,'#fff0ca');rect(18,-23,1,6,'#fff0ca');
const deck=9+Math.round((1-q)*6);poly([[-29,deck],[-23,deck+12],[18,deck+12],[30,deck],[-29,deck]],'#715147');rect(-26,deck,53,3,'#d6a477');rect(-20,deck+4,40,3,'#a97955');rect(-12,deck+8,22,2,'#b68a5d');rect(7,deck-12,13,12,'#dbc494');rect(5,deck-14,17,3,'#987055');rect(11,deck-9,5,4,'#75a9ad');rect(-35,deck+2,8,2,'#675449');rect(-36,deck-3+(Math.floor(t*16)%2)*3,2,10,'#b9b697');

}
function currentPort(){return landed?ports.find(p=>Math.hypot(p.x-ship.x,p.y-ship.y)<40):null}
function syncCargo(){arrival=currentPort();cargoButton.disabled=!!transfer||(!cargo&&islandNear()?false:!arrival||!!cargo&&cargo.type!=='castle'&&cargo.to!==arrival.id);cargoButton.textContent=transfer?'⌛':cargo?'📦 ▼':'📦 ▲';cargoButton.setAttribute('aria-label',cargo?'荷物を降ろす':'荷物を積む');}
function cargoAction(){ensureAudio();syncCargo();if(cargoButton.disabled)return;if(!cargo&&islandNear()){const dest=ports.reduce((a,b)=>Math.hypot(a.x-ship.x,a.y-ship.y)<Math.hypot(b.x-ship.x,b.y-ship.y)?a:b);cargo={type:'castle',from:-1,to:dest.id};skyEvent.taken=true;skyEvent.life=6;sayOnce('宝もの、見つけた。');tone(1320);syncCargo();return}const kind=cargo?'unload':'load';transfer={kind,time:0,portId:arrival.id};tone(660)}
cargoButton.onclick=cargoAction;
addEventListener('keydown',e=>{if(e.code==='KeyF'&&!e.repeat){cargoAction();e.preventDefault()}});
function route(){const m=document.getElementById('route').getContext('2d');m.clearRect(0,0,112,90);const xy=p=>({x:7+(p.x+1100)/2200*98,y:83-(p.y+900)/2200*76});if(cargo){const a=xy(ship),b=xy(ports[cargo.to]);m.strokeStyle=ports[cargo.to].color;m.setLineDash([2,3]);m.beginPath();m.moveTo(a.x,a.y);m.lineTo(b.x,b.y);m.stroke();m.setLineDash([])}ports.forEach(p=>{const a=xy(p);m.fillStyle=p.color;m.font='10px system-ui';m.fillText(p.mark,a.x-4,a.y+3);if(cargo?.to===p.id){m.strokeStyle='#fff';m.strokeRect(a.x-7,a.y-7,14,14)}});if(skyEvent?.kind==='island'&&!skyEvent.taken){const p=xy({x:skyEvent.wx,y:skyEvent.wy});m.fillStyle='#ffe18b';m.font='12px system-ui';m.fillText('✦',p.x-5,p.y+4)}const a=xy(ship);m.fillStyle='#fff';m.fillRect(a.x-2,a.y-2,4,4)}

function update(dt){t+=dt;restTime=landed?restTime+dt:0;if(view>110){if(skyEvent){if(skyEvent.duration-skyEvent.life<2||skyEvent.kind!=='island'||skyEvent.taken||Math.hypot(ship.x-skyEvent.wx,ship.y-skyEvent.wy)>300)skyEvent.life-=dt;if(skyEvent.life<=0){skyEvent=null;skyWait=10+Math.random()*8}}else{skyWait-=dt;if(skyWait<=0){skyEvent={kind:skyVisits++%2===0?'island':'rainbow',x:170+Math.random()*150,duration:50,life:50,wx:clamp(ship.x+100,-1000,1000),wy:clamp(ship.y+80,-800,1200),z:Math.max(120,ship.z),taken:false};sayOnce('あ、見つけた。')}}}else if(skyEvent){skyEvent.life-=dt;if(skyEvent.life<=0)skyEvent=null}noticeTime=Math.max(0,noticeTime-dt);nextMessage-=dt;if(nextMessage<=0&&noticeTime===0){const choices=landed?['風がやさしいね。','ちょっと、のんびり。']:view>110?['雲がふわふわ。','空が広いね。']:cargo?['お届けもの、預かったよ。','ゆっくり行こう。']:['いい風だね。','川がきらきら。','のんびり行こう。'];const options=choices.filter(m=>m!==lastMessage);sayOnce(options[Math.floor(Math.random()*options.length)])}const dx=(k.right?1:0)-(k.left?1:0),dy=(k.up?1:0)-(k.down?1:0),len=Math.hypot(dx,dy)||1;
if(!transfer)ship.z=clamp(ship.z+((k.rise?1:0)-(k.fall?1:0))*36*dt,0,150);if(!transfer&&(ship.z>2||!landed)){ship.x=clamp(ship.x+dx/len*90*dt,-1100,1100);ship.y=clamp(ship.y+dy/len*90*dt,-900,1300)}
const port=ports.find(p=>Math.hypot(p.x-ship.x,p.y-ship.y)<40);const was=landed;landed=!!port&&ship.z<2;if(landed){ship.x+=(port.x-ship.x)*Math.min(1,dt*3);ship.y+=(port.y-ship.y)*Math.min(1,dt*3)}if(landed&&!was){sayOnce('ひと休み。');tone(880)}if(ship.z===0&&!port){ship.z=2;sayOnce('もう少し、ふわり。')}view+=(ship.z-view)*Math.min(1,dt*3);
if(transfer){transfer.time+=dt;if(transfer.time>=1.2){if(transfer.kind==='load'){cargo={from:transfer.portId,to:(transfer.portId+1+deliveries%(ports.length-1))%ports.length,type:['flowers','fruit','letters'][(transfer.portId+deliveries)%3]}}else{ports[transfer.portId].received[cargo.type]++;cargo=null;deliveries++;savePorts();tone(1100)}sayOnce(transfer.kind==='load'?'よいしょ。':ports[transfer.portId].received.castle?'お城ができた。':'届いたよ。');transfer=null}}
syncCargo();route();
}

function draw(){ground();for(let i=0;i<5;i++){let x=((i*107+t*(2+i)+ship.x*.04)%500+500)%500-60;cloud(x,30+i%3*16,.6+i%2*.4)}if(view>85){for(let i=0;i<2;i++)cloud(((i*257+t*15-ship.x*.15)%600+600)%600-100,210+i*35,1.6)}skyDiscoveries();balloon();}

function loop(now){const dt=last?Math.min((now-last)/1000,.04):0;last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
