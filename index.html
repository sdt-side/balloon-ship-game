<script>
'use strict';
const c=document.getElementById('game'),g=c.getContext('2d'),W=400,H=280,k={},ship={x:0,y:0,z:16},ports=[{x:0,y:0,name:'草原の港'},{x:430,y:260,name:'川辺の村'},{x:-480,y:620,name:'森の停泊場'},{x:670,y:-480,name:'丘の村'},{x:-720,y:-520,name:'北の港'},{x:-850,y:180,name:'西の村'},{x:920,y:760,name:'東の港'},{x:130,y:1050,name:'南の港'},{x:-620,y:1080,name:'森の港'},{x:860,y:40,name:'風の港'}];let t=0,last=0,view=16,muted=false,audio,bgmOsc,sfxOsc,bgmTimer,landed=false,notice='',noticeTime=0,nextMessage=14,lastMessage='';
function sayOnce(message){if(noticeTime>0)return;notice=message;lastMessage=message;noticeTime=3.2;nextMessage=22+Math.random()*20}
ports.forEach((p,i)=>{p.id=i;p.mark=['●','◆','▲','■','★','♥','✚','☀','☾','✿'][i];p.color=['#ef886b','#6aa9e3','#94bf65','#cc8bcc','#f2cc67','#72c7ba','#e2a573','#a2a5ed','#e591b1','#aac95f'][i]});let treasure=null,cargo=null,deliveries=0,transfer=null,arrival=null;const cargoButton=document.getElementById('cargo');
ports.forEach(p=>p.received={flowers:0,fruit:0,letters:0,castle:0,observatory:0});
let idleTime=0,idleSpoke=false,restTime=0,skyWait=3,skyEvent=null,skyVisits=0,whale=null,whaleWait=22,lastDiscovery='';
let restoredState=null;try{const saved=JSON.parse(localStorage.getItem('balloon-port-life-v1')||'null');if(saved){restoredState=saved;ports.forEach((p,i)=>{for(const type of ['flowers','fruit','letters','castle','observatory'])p.received[type]=Math.max(0,Math.min(8,Number(saved.ports?.[i]?.[type])||0))});deliveries=ports.reduce((n,p)=>n+p.received.flowers+p.received.fruit+p.received.letters,0)}}catch(e){}
const CAP=8;const stage=n=>n>=8?4:n>=5?3:n>=3?2:n>=1?1:0;
function specialType(item){return item.type==='skyletter'?'observatory':'castle'}
function available(port,type,except=null){return port.received[type]+(cargo&&cargo!==except&&cargo.to===port.id&&cargo.type===type?1:0)+(treasure&&treasure!==except&&treasure.to===port.id&&specialType(treasure)===type?1:0)<CAP}
function openDestination(type,except=null){return ports.filter(p=>available(p,type,except)).sort((a,b)=>Math.hypot(a.x-ship.x,a.y-ship.y)-Math.hypot(b.x-ship.x,b.y-ship.y))[0]}
function loadPlan(port){if(!port||cargo)return null;const types=['flowers','fruit','letters'];for(let i=0;i<3;i++){const type=types[(port.id+deliveries+i)%3];const dest=ports.find(p=>p.id!==port.id&&available(p,type));if(dest)return{from:port.id,to:dest.id,type}}return null}
function deliver(port,type){if(port.received[type]>=CAP)return false;port.received[type]++;if(port.received[type]===CAP)port.completeTime=3;return true}
function savePorts(){try{localStorage.setItem('balloon-port-life-v1',JSON.stringify({ports:ports.map(p=>p.received),cargo,treasure,ship:{x:ship.x,y:ship.y,z:ship.z}}))}catch(e){}}
if(restoredState){const validCargo=restoredState.cargo;if(validCargo&&['flowers','fruit','letters'].includes(validCargo.type)&&Number.isInteger(validCargo.to)&&ports[validCargo.to]&&Number.isInteger(validCargo.from)&&ports[validCargo.from])cargo=validCargo;const validTreasure=restoredState.treasure;if(validTreasure&&['castle','skyletter'].includes(validTreasure.type))treasure=validTreasure;const p=restoredState.ship;if(p&&[p.x,p.y,p.z].every(Number.isFinite)){ship.x=Math.max(-1100,Math.min(1100,p.x));ship.y=Math.max(-900,Math.min(1300,p.y));ship.z=Math.max(0,Math.min(150,p.z));view=ship.z}}
// Restore reserved capacity from the saved carried items.
if(cargo&&ports[cargo.to].received[cargo.type]>=CAP)ports[cargo.to].received[cargo.type]=CAP-1;
if(treasure){const type=specialType(treasure);let dest=ports[treasure.to];if(!dest||!available(dest,type,treasure))dest=openDestination(type,treasure);if(!dest){dest=ports[0];dest.received[type]=CAP-1}treasure.to=dest.id}
addEventListener('pagehide',savePorts);document.addEventListener('visibilitychange',()=>{if(document.hidden)savePorts()});
function parcel(type,x,y,s=1){g.save();g.translate(Math.round(x),Math.round(y));g.scale(s,s);if(type==='skyletter'){rect(-6,-3,12,8,'#e8f5fb');poly([[-5,-2],[0,2],[5,-2]],'#80adb9');rect(-1,0,2,2,'#e9bd5b');rect(8,-7,1,5,'#fff3b3');rect(6,-5,5,1,'#fff3b3')}else if(type==='castle'){rect(-7,-4,14,10,'#b78b49');rect(-7,-6,14,3,'#f3d580');rect(-1,-6,2,12,'#ffeda0');rect(-3,-2,6,4,'#f9db6c');rect(-1,-1,2,2,'#fff6d0')}else if(type==='flowers'){rect(-5,0,10,7,'#ae7452');for(let i=-3;i<=3;i+=3){rect(i,-7,1,8,'#558646');rect(i-2,-9,5,3,i===0?'#fff0b2':'#eda3c0')}}else if(type==='fruit'){rect(-6,0,12,6,'#bd8b56');for(let i=-3;i<=3;i+=3){rect(i-1,-4,3,4,i===0?'#f2bd53':'#da7854');rect(i,-6,1,2,'#5e884b')}}else{rect(-6,-3,12,8,'#fff0cf');poly([[-5,-2],[0,2],[5,-2]],'#c9ac7b');rect(-1,1,2,2,'#c68171')}g.restore()}
function portLife(port,x,y,s){const r=port.received;if(r.castle){const cx=x+85*s,cy=y+5*s;g.save();g.translate(cx,cy);g.scale(s*1.25,s*1.25);rect(-31,-26,62,31,'#d8d3c2');rect(-31,-26,62,4,'#f0e9d4');for(let i=-30;i<30;i+=8)rect(i,-32,5,7,'#e5dfcb');for(let row=0;row<4;row++)for(let col=0;col<7;col++)rect(-29+col*9+(row%2)*4,-21+row*7,7,1,'#b6b4a7');for(const tx of [-35,23]){rect(tx,-44,12,49,'#e9e3d1');rect(tx+2,-31,3,7,'#7693a0');poly([[tx-3,-44],[tx+6,-58],[tx+15,-44]],port.color)}rect(-13,-48,26,23,'#eee8d6');poly([[-16,-48],[0,-65],[16,-48]],port.color);rect(-4,-39,8,8,'#7fa8b4');rect(-7,-9,14,14,'#8c7763');rect(-5,-12,10,5,'#8c7763');rect(0,-73,1,9,'#937459');poly([[1,-73],[12,-70],[1,-67]],port.color);if(stage(r.castle)>=2){rect(-45,3,90,7,'#b6c29a');for(let i=-39;i<=39;i+=13){rect(i,1,4,3,'#efc8dc');rect(i+1,4,1,4,'#769658')}}if(stage(r.castle)>=3){rect(41,-25,11,30,'#e4ddc7');poly([[38,-25],[46,-40],[55,-25]],port.color)}if(stage(r.castle)>=4){rect(-52,-35,10,40,'#e4ddc7');poly([[-55,-35],[-47,-51],[-39,-35]],port.color)}g.restore()} if(r.observatory){const ox=x-85*s,oy=y;rect(ox-15*s,oy-17*s,30*s,21*s,'#e8dfc6');rect(ox-18*s,oy-22*s,36*s,7*s,'#91b7c7');rect(ox-14*s,oy-28*s,28*s,7*s,'#abc9d4');rect(ox-8*s,oy-32*s,16*s,5*s,'#c7dce3');rect(ox-2*s,oy-27*s,3*s,14*s,'#708b9a');rect(ox+3*s,oy-29*s,16*s,4*s,'#638997');rect(ox+17*s,oy-30*s,3*s,6*s,'#e7d4a2');rect(ox-5*s,oy-7*s,10*s,11*s,'#9c8770')} const fs=stage(r.flowers),ms=stage(r.fruit),ls=stage(r.letters),os=stage(r.observatory);
if(fs>=2){rect(x-35*s,y+14*s,70*s,3*s,'#9b9a77')}if(fs>=3){rect(x-40*s,y+23*s,80*s,4*s,'#6d9c64')}if(fs>=4){for(let i=-35;i<=35;i+=14)parcel('flowers',x+i*s,y+30*s,s)}
if(ms>=2){rect(x+45*s,y-7*s,32*s,5*s,'#b99865');rect(x+46*s,y-16*s,2*s,15*s,'#856d51');rect(x+74*s,y-16*s,2*s,15*s,'#856d51')}if(ms>=3){rect(x+41*s,y-22*s,40*s,7*s,port.color)}if(ms>=4){rect(x+87*s,y-7*s,25*s,10*s,'#e9d7ab');rect(x+84*s,y-16*s,31*s,7*s,port.color)}
if(ls>=2){rect(x-66*s,y-17*s,25*s,22*s,'#e4d4ad');poly([[x-69*s,y-17*s],[x-54*s,y-29*s],[x-38*s,y-17*s]],port.color)}if(ls>=3){rect(x-73*s,y-24*s,34*s,28*s,'#e7dcc0');rect(x-66*s,y-19*s,7*s,7*s,'#95b6bf')}if(ls>=4){rect(x-58*s,y-42*s,11*s,20*s,'#e7dcc0');rect(x-56*s,y-38*s,7*s,7*s,'#fff0d4');rect(x-53*s,y-37*s,1*s,4*s,'#716553')}
if(os>=2){rect(x-99*s,y-34*s,30*s,4*s,'#5b7d8f')}if(os>=3){rect(x-110*s,y+7*s,50*s,3*s,'#c5be99')}if(os>=4){for(let i=0;i<4;i++)parcel('flowers',x+(-109+i*15)*s,y+14*s,s)}
if(port.completeTime>0){g.save();g.globalAlpha=Math.min(1,port.completeTime);g.fillStyle='#fff7d7';g.font='12px system-ui';g.fillText('✓',x-5,y-44*s);g.restore()}
const total=r.flowers+r.fruit+r.letters;
for(let i=0;i<stage(r.flowers)*2;i++)parcel('flowers',x+(-23+i*9)*s,y+14*s,s);
for(let i=0;i<stage(r.fruit);i++)parcel('fruit',x+(25+i%2*13)*s,y+(8+Math.floor(i/2)*10)*s,s);
if(r.letters){rect(x-43*s,y-15*s,3*s,24*s,'#7e6449');rect(x-47*s,y-17*s,12*s,8*s,'#6995ab');parcel('letters',x-41*s,y-14*s,.5*s)}
for(let i=0;i<Math.min(3,Math.floor(total/2));i++){const fx=x+(56+i*10)*s;rect(fx,y-15*s,2*s,28*s,'#81684b');poly([[fx+2*s,y-15*s],[fx+12*s,y-12*s],[fx+2*s,y-8*s]],port.color)}
if(total>=4){const wx=x-57*s,wy=y-12*s;rect(wx-2*s,wy,4*s,25*s,'#d5c493');g.save();g.translate(wx,wy);g.rotate(t*.7);for(let i=0;i<4;i++){g.rotate(Math.PI/2);rect(2,-2,13*s,3*s,'#f4e5b8')}g.restore()}
}
function rainbowNear(){return view>=100&&skyEvent?.kind==='rainbow'&&!skyEvent.taken&&skyEvent.duration-skyEvent.life>.2&&Math.hypot(ship.x-skyEvent.wx,ship.y-skyEvent.wy)<230&&Math.abs(ship.z-skyEvent.z)<60}
function discoveryNear(){return islandNear()||rainbowNear()}
function cloudWhale(){if(!whale||view<110)return;const age=whale.duration-whale.life,x=-65+age*12,y=53+Math.sin(age*.35)*4;g.save();g.globalAlpha=Math.min(1,age/2,whale.life/2);rect(x-20,y-10,45,22,'#edf7ed');rect(x-27,y-5,60,12,'#edf7ed');rect(x-12,y-15,29,7,'#edf7ed');rect(x+31,y-2,11,6,'#edf7ed');rect(x+40,y-10,5,17,'#edf7ed');rect(x+45,y-13,7,5,'#edf7ed');rect(x+45,y+7,7,5,'#edf7ed');rect(x-19,y-2,2,2,'#91b1bd');rect(x-4,y+9,9,5,'#dce9df');rect(x-6,y-28,2,9,'#edf7ed');rect(x-12,y-30,13,2,'#edf7ed');g.restore()}
function islandPosition(){return{x:200+(skyEvent.wx-ship.x)*.35,y:185+(skyEvent.wy-ship.y)*.2+(ship.z-skyEvent.z)*.6}}
function islandNear(){return view>=110&&skyEvent?.kind==='island'&&skyEvent.duration-skyEvent.life>=.2&&!skyEvent.taken&&Math.hypot(ship.x-skyEvent.wx,ship.y-skyEvent.wy)<180&&Math.abs(ship.z-skyEvent.z)<45}
function skyDiscoveries(){if(!skyEvent||view<100)return;const age=skyEvent.duration-skyEvent.life,alpha=Math.min(1,age/2,skyEvent.life/2,(view-100)/15);g.save();g.globalAlpha=alpha;let x=skyEvent.x+Math.sin(age*.2)*8,y=62+Math.sin(age*.5)*3;if(skyEvent.kind==='birds'){g.fillStyle='#758f9e';for(let i=0;i<6;i++){const bx=(420-age*25+i*18),by=62+i%3*12+Math.sin(age*3+i)*3;rect(bx,by,3,1,'#758f9e');rect(bx-2,by-2,2,1,'#758f9e');rect(bx+3,by-2,2,1,'#758f9e')}g.restore();return}if(skyEvent.kind==='whale'){g.restore();return}if(skyEvent.kind==='rainbow'){const pos=islandPosition();x=pos.x;y=pos.y-20;const colors=['#ee9c9c','#f2c080','#e6dc90','#9acb9a','#8ab8d4','#b9a4d2'];colors.forEach((col,i)=>{const radius=40-i*3;for(let a=0;a<=Math.PI;a+=.065)rect(x+Math.cos(a)*radius,y-Math.sin(a)*radius,3,3,col)});cloud(x-48,y,1);cloud(x+25,y,1);if(!skyEvent.taken){const p=islandPosition();parcel('skyletter',p.x,p.y-8,1.1)}}else{const pos=islandPosition();x=pos.x;y=pos.y;poly([[x-25,y],[x+27,y],[x+16,y+14],[x-8,y+24]],'#a69177');rect(x-26,y-3,54,5,'#a7bb8c');rect(x-23,y-1,45,3,'#7e9474');if(!skyEvent.taken){parcel('castle',x,y-9,1.1);}cloud(x-36,y+18,.9)}g.restore()}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
function poly(points,col){g.fillStyle=col;g.beginPath();points.forEach((p,i)=>i?g.lineTo(Math.round(p[0]),Math.round(p[1])):g.moveTo(Math.round(p[0]),Math.round(p[1])));g.closePath();g.fill()}
function hash(x,y){let n=Math.imul(x,374761393)^Math.imul(y,668265263);n=Math.imul(n^(n>>>13),1274126177);return(n^(n>>>16))>>>0}
function ensureAudio(){if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();let i=0,n=[523,659,784,659,587,698,880,698];const playNote=()=>{if(muted||audio.state!=='running')return;stop(bgmOsc);let o=audio.createOscillator(),g=audio.createGain();bgmOsc=o;o.type='square';o.frequency.value=n[i++%n.length];g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.18);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.18)};bgmTimer=setInterval(playNote,330);audio.resume().then(playNote).catch(()=>{})}if(audio.state!=='running')audio.resume().catch(()=>{})}function stop(o){try{o&&o.stop()}catch(e){}}function sfx(f=440,d=.06,type='square',v=.03){if(muted||!audio||audio.state!=='running')return;stop(sfxOsc);let o=audio.createOscillator(),g=audio.createGain();sfxOsc=o;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}
function tone(freq=600){sfx(freq,.16,'square',.025)}
document.getElementById('sound').onclick=()=>{muted=audio?.state==='running'?!muted:false;const button=document.getElementById('sound');button.textContent=muted?'×':'♪';button.setAttribute('aria-pressed',String(!muted));if(muted){stop(bgmOsc);stop(sfxOsc)}ensureAudio()};
addEventListener('pointerdown',ensureAudio,{capture:true});addEventListener('touchend',ensureAudio,{passive:true});addEventListener('keydown',ensureAudio);
const map={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',KeyE:'rise',Space:'rise',KeyQ:'fall',ShiftLeft:'fall',ShiftRight:'fall'};
addEventListener('keydown',e=>{if(map[e.code]){k[map[e.code]]=true;e.preventDefault()}});addEventListener('keyup',e=>{if(map[e.code]){k[map[e.code]]=false;e.preventDefault()}});function release(){Object.keys(k).forEach(x=>k[x]=false);document.querySelectorAll('.held').forEach(b=>b.classList.remove('held'));last=0}addEventListener('blur',release);document.addEventListener('visibilitychange',release);
document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=e=>{ensureAudio();b.setPointerCapture(e.pointerId);k[b.dataset.k]=true;b.classList.add('held');e.preventDefault()};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>{k[b.dataset.k]=false;b.classList.remove('held')}});
let f=0,horizon=0,camDepth=0;
function project(x,y){const dx=x-ship.x,dy=y-ship.y,depth=dy+camDepth;const sc=260/(260+depth);return{x:200+dx*sc,y:horizon+((169.5+view/150*75-horizon)*(260+camDepth))/(260+depth),s:sc,d:depth}}
function ground(){const q=view/150;f=.84-q*.69;horizon=24+q*70;camDepth=145+q*310;
rect(0,0,W,H,'#a9dbe1');rect(0,0,W,44,'#84c4d9');rect(0,44,W,45,'#98d1df');poly([[0,horizon+12],[38,horizon-6],[65,horizon+8],[99,horizon-13],[143,horizon+11],[183,horizon-2],[225,horizon+14],[276,horizon-15],[312,horizon+6],[355,horizon-4],[400,horizon+12],[400,H],[0,H]],'#8fb7a3');rect(0,horizon+19,W,H,'#86b966');
const range=1800,step=42,startX=Math.floor((ship.x-range)/step)*step,startY=Math.floor((ship.y-camDepth+28)/step)*step;let objects=[];
for(let y=startY;y<ship.y+range;y+=step){for(let x=startX;x<ship.x+range;x+=step){const p=project(x,y);if(p.d<25||p.x<-90||p.x>490||p.y< horizon||p.y>330)continue;const n=hash(x,y),s=p.s;const river=Math.abs(x-(180+Math.sin(y/260)*90))<45;
if(river){rect(p.x-23*s,project(x,y+step).y-1,46*s,Math.max(2,p.y-project(x,y+step).y+2),'#63b9c7');if(n%4===0)rect(p.x,p.y,12*s,1,'#b5e9df');if(Math.abs(y-280)<25)rect(p.x-24*s,p.y-3*s,48*s,7*s,'#b58a59');}
else{if(n%11===0)rect(p.x,p.y,5*s,Math.max(1,2*s),'#c8c190');if(n%5===0){rect(p.x,p.y,1,3*s,'#66974e');rect(p.x+3*s,p.y+2*s,2*s,1,'#6e9f50')}if(n%19===0)rect(p.x,p.y,2*s,2*s,'#f5e2a0');if(n%23===0)objects.push({p,type:'tree'});else if(n%31===0)objects.push({p,type:'rock'})}}
}

function balloon(){const q=view/150,x=200+Math.sin(t*1.7)*1.5,y=156+q*24+(landed?0:Math.sin(t*2)*2);const landingPoint=project(ship.x,ship.y);rect(landingPoint.x-9,landingPoint.y-1,18,3,'#507b6550');

if(transfer){const p=project(arrival.x,arrival.y),a=transfer.time/1.2;const v=transfer.kind==='load'?a:1-a;const bx=p.x+(x-p.x)*v,by=p.y+(y+5-p.y)*v-Math.sin(a*Math.PI)*20;parcel(transfer.kind==='treasure'?treasure.type:transfer.kind==='load'?cargo.type:cargo.type,bx,by,1)}

function currentPort(){return landed?ports.find(p=>Math.hypot(p.x-ship.x,p.y-ship.y)<40):null}
function syncCargo(){arrival=currentPort();const type=skyEvent?.kind==='rainbow'?'observatory':'castle';const pickup=discoveryNear()&&!treasure&&!!openDestination(type);const canSpecial=arrival&&treasure&&available(arrival,specialType(treasure),treasure);const canNormal=arrival&&cargo&&cargo.to===arrival.id&&available(arrival,cargo.type,cargo);const plan=loadPlan(arrival);const unload=!!(canSpecial||canNormal);cargoButton.disabled=!!transfer||!(pickup||unload||plan);cargoButton.style.boxShadow=pickup?'0 0 0 2px #ffe7a0,0 0 18px #ffe7a0':'none';cargoButton.textContent=transfer?'⌛':pickup?'📦 ▲':unload?'📦 ▼':cargo||treasure?'📦 ▼':'📦 ▲';cargoButton.setAttribute('aria-label',pickup?(skyEvent.kind==='rainbow'?'手紙を拾う':'宝箱を拾う'):unload?'荷物を降ろす':'荷物を積む');}
function chooseDiscovery(){let choices=['birds','whale'];if(!treasure){if(openDestination('castle'))choices.push('island');if(openDestination('observatory'))choices.push('rainbow')}const filtered=choices.filter(k=>k!==lastDiscovery);const options=filtered.length?filtered:choices;const kind=options[Math.floor(Math.random()*options.length)];lastDiscovery=kind;return kind}
function pickupDiscovery(){if(!discoveryNear()||treasure)return false;const type=skyEvent.kind==='rainbow'?'observatory':'castle',dest=openDestination(type);if(!dest)return false;treasure={type:skyEvent.kind==='rainbow'?'skyletter':'castle',to:dest.id};skyEvent.taken=true;skyEvent.life=6;noticeTime=0;sayOnce(treasure.type==='skyletter'?'空から手紙だ。':'宝もの、見つけた。');savePorts();tone(1320);syncCargo();return true}
function cargoAction(){ensureAudio();syncCargo();if(cargoButton.disabled)return;if(pickupDiscovery())return;
if(treasure&&arrival&&available(arrival,specialType(treasure),treasure)){treasure.to=arrival.id;transfer={kind:'treasure',time:0,portId:arrival.id};savePorts();tone(660);return}
if(cargo&&arrival&&cargo.to===arrival.id&&available(arrival,cargo.type,cargo)){transfer={kind:'unload',time:0,portId:arrival.id};tone(660);return}
const plan=loadPlan(arrival);if(plan){cargo=plan;transfer={kind:'load',time:0,portId:arrival.id};savePorts();tone(660)}}
cargoButton.onclick=cargoAction;
addEventListener('keydown',e=>{if(e.code==='KeyF'&&!e.repeat){cargoAction();e.preventDefault()}});

function update(dt){t+=dt;ports.forEach(p=>p.completeTime=Math.max(0,(p.completeTime||0)-dt));if(whale){whale.life-=dt;if(whale.life<=0){whale=null;whaleWait=45+Math.random()*40}}else if(view>110&&!Object.values(k).some(Boolean)){whaleWait-=dt;if(whaleWait<=0){whale={duration:38,life:38};noticeTime=0;sayOnce('雲が、くじらみたい。')}}const idle=!Object.values(k).some(Boolean)&&!transfer;idleTime=idle?idleTime+dt:0;if(!idle){idleSpoke=false;if(notice==='zzzz...')noticeTime=0;}if(idleTime>18&&!idleSpoke&&noticeTime<=0){sayOnce('zzzz...');idleSpoke=true}restTime=landed?restTime+dt:0;if(view>110){if(skyEvent){if(skyEvent.duration-skyEvent.life<2||skyEvent.kind!=='island'||skyEvent.taken||Math.hypot(ship.x-skyEvent.wx,ship.y-skyEvent.wy)>300)skyEvent.life-=dt;if(skyEvent.life<=0){skyEvent=null;skyWait=18+Math.random()*14}}else{skyWait-=dt;if(skyWait<=0){skyEvent={kind:chooseDiscovery(),x:170+Math.random()*150,duration:50,life:50,wx:clamp(ship.x+100,-1000,1000),wy:clamp(ship.y+80,-800,1200),z:Math.max(120,ship.z),taken:false};noticeTime=0;sayOnce(skyEvent.kind==='island'?'あっ、空に宝箱！':skyEvent.kind==='rainbow'?'わあ、虹だ！':skyEvent.kind==='birds'?'鳥たちのお散歩。':'雲が、くじらみたい。');if(skyEvent.kind==='whale')whale={duration:38,life:38}}}}else if(skyEvent){skyEvent.life-=dt;if(skyEvent.life<=0)skyEvent=null}noticeTime=Math.max(0,noticeTime-dt);nextMessage-=dt;if(nextMessage<=0&&noticeTime===0&&idleTime<18){const choices=landed?['風がやさしいね。','ちょっと、のんびり。']:view>110?['雲がふわふわ。','空が広いね。']:cargo?['お届けもの、預かったよ。','ゆっくり行こう。']:['いい風だね。','川がきらきら。','のんびり行こう。'];const options=choices.filter(m=>m!==lastMessage);sayOnce(options[Math.floor(Math.random()*options.length)])}const dx=(k.right?1:0)-(k.left?1:0),dy=(k.up?1:0)-(k.down?1:0),len=Math.hypot(dx,dy)||1;
if(!transfer)ship.z=clamp(ship.z+((k.rise?1:0)-(k.fall?1:0))*36*dt,0,150);if(!transfer&&(ship.z>2||!landed)){ship.x=clamp(ship.x+dx/len*90*dt,-1100,1100);ship.y=clamp(ship.y+dy/len*90*dt,-900,1300)}
const port=ports.find(p=>Math.hypot(p.x-ship.x,p.y-ship.y)<40);const was=landed;landed=!!port&&ship.z<2;if(landed){ship.x+=(port.x-ship.x)*Math.min(1,dt*3);ship.y+=(port.y-ship.y)*Math.min(1,dt*3)}if(landed&&!was){noticeTime=0;sayOnce('到着。');tone(880)}if(ship.z===0&&!port){ship.z=2;}view+=(ship.z-view)*Math.min(1,dt*3);
if(transfer){transfer.time+=dt;if(transfer.time>=1.2){let message='よいしょ。';if(transfer.kind==='treasure'){const special=specialType(treasure);if(deliver(ports[transfer.portId],special)){treasure=null;message=special==='observatory'?'空を眺める場所が育った。':'お城が育った。';tone(1320)}}else if(transfer.kind==='unload'){if(deliver(ports[transfer.portId],cargo.type)){cargo=null;deliveries++;message='お届けしました。';tone(1100)}}noticeTime=0;sayOnce(message);transfer=null;savePorts()}}

pickupDiscovery();syncCargo();route();
}

function draw(){ground();for(let i=0;i<5;i++){let x=((i*107+t*(2+i)+ship.x*.04)%500+500)%500-60;cloud(x,30+i%3*16,.6+i%2*.4)}if(view>85){for(let i=0;i<2;i++)cloud(((i*257+t*15-ship.x*.15)%600+600)%600-100,210+i*35,1.6)}cloudWhale();skyDiscoveries();balloon();}
